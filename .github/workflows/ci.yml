name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build web (frontend)
        working-directory: web
        run: |
          npm install --no-audit --prefer-offline --no-progress
          npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --prefer-offline --no-progress

      - name: Start server
        run: |
          # start server in background and capture logs/pid
          PORT=3001 node server/index.js > server.log 2>&1 & echo $! > server.pid
        shell: bash

      - name: Wait for server to be ready
        run: |
          for i in {1..15}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/asr || true)
            echo "attempt $i -> $code"
            if [[ "$code" == "400" || "$code" == "501" || "$code" == "200" ]]; then
              echo "server is up"
              break
            fi
            sleep 2
          done

      - name: Generate sample WAV for ASR test
        run: |
          node scripts/generate-sample-wav.js

      - name: Functional ASR test (if configured)
        run: |
          if [[ -z "$WHISPER_CMD_TEMPLATE" ]]; then
            echo "WHISPER_CMD_TEMPLATE not set — skipping ASR functional test"
            exit 0
          fi
          echo "Posting sample WAV to /api/asr"
          status=$(curl -s -o /dev/null -w "%{http_code}" -F "file=@scripts/sample.wav" -F "lang=yue" http://localhost:3001/api/asr || true)
          echo "asr status=$status"
          if [[ "$status" != "200" ]]; then
            echo "Expected 200 from /api/asr but got $status"
            cat server.log || true
            exit 1
          fi
        shell: bash

      - name: Smoke test /api/ocr
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/ocr || true)
          echo "ocr status=$status"
          if [[ "$status" != "400" && "$status" != "200" ]]; then
            echo "Unexpected status $status"
            cat server.log || true
            exit 1
          fi

      - name: Cleanup
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm -f server.pid
          fi
          cat server.log || true
        shell: bash
